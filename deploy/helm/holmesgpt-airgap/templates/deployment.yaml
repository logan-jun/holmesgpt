apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-holmes
  namespace: {{ .Release.Namespace }}
  labels:
    app: holmes
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: holmes
  template:
    metadata:
      labels:
        app: holmes
      annotations:
        checksum/toolset-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "holmesgpt.serviceAccountName" . }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 6 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      containers:
      - name: holmes
        image: {{ include "holmesgpt.image" . | quote }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command:
          - "python3"
          - "-u"
          - "-c"
          - |
            import litellm, json, os
            model_cost_file = "/etc/holmes/config/litellm_model_cost.json"
            if os.path.exists(model_cost_file):
                with open(model_cost_file) as f:
                    litellm.register_model(json.load(f))
                print(f"[init] Registered custom models from {model_cost_file}")
            import runpy
            runpy.run_path("server.py", run_name="__main__")
        ports:
        - containerPort: 5050
          name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
          - name: LOG_LEVEL
            value: {{ .Values.logLevel }}
          # Air-gapped: telemetry and Sentry disabled
          - name: ENABLE_TELEMETRY
            value: "false"
          - name: ROBUSTA_AI
            value: "false"
          - name: SENTRY_DSN
            value: ""
          # vLLM / LLM configuration
          {{- if and .Values.vllm.apiKey (ne .Values.vllm.apiKey "none") (ne .Values.vllm.apiKey "") }}
          - name: OPENAI_API_KEY
            value: {{ .Values.vllm.apiKey | quote }}
          {{- end }}
          {{- if and .Values.vllm.endpoint (ne .Values.vllm.endpoint "") }}
          - name: OPENAI_BASE_URL
            value: {{ .Values.vllm.endpoint | quote }}
          {{- end }}
          - name: MODEL
            value: {{ .Values.vllm.modelName | quote }}
          - name: REQUEST_TIMEOUT
            value: {{ .Values.vllm.requestTimeout | quote }}
          - name: TEMPERATURE
            value: {{ .Values.temperature | quote }}
          {{- if .Values.vllm.maxContentSize }}
          - name: OVERRIDE_MAX_CONTENT_SIZE
            value: {{ .Values.vllm.maxContentSize | quote }}
          {{- end }}
          {{- if .Values.vllm.maxOutputToken }}
          - name: OVERRIDE_MAX_OUTPUT_TOKEN
            value: {{ .Values.vllm.maxOutputToken | quote }}
          {{- end }}
          {{- if .Values.openshift }}
          - name: IS_OPENSHIFT
            value: "True"
          {{- end }}
          {{- if .Values.additionalEnvVars }}
          {{- toYaml .Values.additionalEnvVars | nindent 10 }}
          {{- end }}
        lifecycle:
          preStop:
            exec:
              command: ["bash", "-c", "kill -SIGINT 1"]
        volumeMounts:
          - name: custom-toolsets-configmap
            mountPath: /etc/holmes/config
          {{- if .Values.additionalVolumeMounts }}
          {{- toYaml .Values.additionalVolumeMounts | nindent 10 }}
          {{- end }}
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            memory: {{ .Values.resources.limits.memory }}
            {{- if .Values.resources.limits.cpu }}
            cpu: {{ .Values.resources.limits.cpu | quote }}
            {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: custom-toolsets-configmap
          configMap:
            name: {{ .Release.Name }}-toolsets-configmap
            optional: true
        {{- if .Values.additionalVolumes }}
        {{- toYaml .Values.additionalVolumes | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-holmes
  namespace: {{ .Release.Namespace }}
  labels:
    app: holmes
spec:
  selector:
    app: holmes
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5050
